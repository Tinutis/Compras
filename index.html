<style>
/* Layout: one narrow column like a paper list. Sections by supermarket aisle, a cart section at the bottom, and an add bar pinned to the bottom edge. */
:root {
  --bg: #f2e9d8;
  --surface: #fbf6ea;
  --ink: #3a2a1d;
  --muted: #7b6652;
  --line: #e1d4bc;

  --c-red: #b5473a;
  --c-orange: #d4803a;
  --c-amber: #d9a521;
  --c-lime: #8a9a3b;
  --c-green: #5e8c4f;
  --c-teal: #4f8f8b;
  --c-blue: #5b82a8;
  --c-indigo: #7a74b0;
  --c-purple: #8e5a86;
  --c-pink: #c4687e;
  --c-gray: #8f8272;
  --bar-h: 170px;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1812;
    --surface: #2a2118;
    --ink: #f2e6d2;
    --muted: #b9a68f;
    --line: #3e3226;
    --accent: #e6b73c;
    --accent-ink: #1f1812;
    --accent-soft: #4a3a1c;
    --btn: #e5b02e;
    --btn-ink: #2a1b10;
    --done: #8a7a66;
    --c-red: #e0806f;
    --c-orange: #e8a261;
    --c-amber: #e7c25a;
    --c-lime: #b5c26a;
    --c-green: #8db97c;
    --c-teal: #7fbab5;
    --c-blue: #8fb1d4;
    --c-indigo: #a9a4d6;
    --c-purple: #c79bc0;
    --c-pink: #e39aac;
    --c-gray: #b3a692;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1812;
  --surface: #2a2118;
  --ink: #f2e6d2;
  --muted: #b9a68f;
  --line: #3e3226;
  --accent: #e6b73c;
  --accent-ink: #1f1812;
  --accent-soft: #4a3a1c;
  --btn: #e5b02e;
  --btn-ink: #2a1b10;
  --done: #8a7a66;
  --c-red: #e0806f;
  --c-orange: #e8a261;
  --c-amber: #e7c25a;
  --c-lime: #b5c26a;
  --c-green: #8db97c;
  --c-teal: #7fbab5;
  --c-blue: #8fb1d4;
  --c-indigo: #a9a4d6;
  --c-purple: #c79bc0;
  --c-pink: #e39aac;
  --c-gray: #b3a692;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: 20px calc(var(--bar-h) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 520px; margin: 0 auto; min-width: 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.02em; color: var(--accent); }
.sync { font-size: 12px; color: var(--muted); }

h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 40px;
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin: 14px 0 4px;
  text-wrap: balance;
}
.sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; font-variant-numeric: tabular-nums; }

.note {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin-bottom: 16px;
  font-size: 14px;
}
.note button {
  border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 6px 4px; white-space: nowrap;
}

.section { margin-bottom: 20px; }
.section h2 {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 0 0 6px; padding: 0 2px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.section h2 button {
  border: 0; background: transparent; color: var(--accent); font-size: 13px; font-weight: 600;
  letter-spacing: 0; text-transform: none; padding: 4px 2px;
}
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 4px; min-height: 54px; padding-right: 8px; }
.row + .row { border-top: 1px solid var(--line); }
.main {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
  border: 0; background: transparent; text-align: left; padding: 8px 4px 8px 14px; min-height: 54px;
}
.tick {
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--cc, var(--done)); display: grid; place-items: center; color: transparent;
}
.tick svg { width: 14px; height: 14px; }
.name { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.row.done .tick { background: color-mix(in srgb, var(--cc, var(--accent)) 25%, var(--surface)); border-color: var(--cc, var(--accent)); color: var(--ink); }
.row.done .name { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.qty { flex: none; display: flex; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; }
.qty button {
  width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent;
  font-size: 20px; line-height: 1; color: var(--muted);
}
.qty button:active { background: var(--accent-soft); }
.qty .n { min-width: 22px; text-align: center; font-weight: 600; }

.empty { text-align: center; color: var(--muted); padding: 36px 16px; }
.empty strong { display: block; font-family: var(--font-display); font-size: 20px; color: var(--ink); margin-bottom: 4px; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.bar-in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {

  padding: 10px 14px; font-size: 14px; white-space: nowrap;
}

.editchip { color: var(--muted, var(--ink)); font-weight: 600; background: transparent; }

.delchip .x { margin-left: 8px; color: var(--c-red); font-weight: 700; }
.form { display: flex; gap: 8px; min-width: 0; }
.form input[type="text"] {
  flex: 1; min-width: 0; height: 48px; padding: 0 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); font-size: 16px;
}
.form select {
  flex: none; width: 104px; height: 48px; padding: 0 8px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); font-size: 14px;
}
.form .add {
  flex: none; height: 48px; padding: 0 18px; border-radius: 12px; border: 0;
  background: var(--btn); color: var(--btn-ink); font-weight: 600;
}
.nm { display: flex; flex-direction: column; min-width: 0; }
.src { font-size: 12px; color: var(--muted); font-weight: 400; }

.tabs { display: flex; gap: 4px; padding: 4px; background: var(--line); border-radius: 12px; margin: 0 0 18px; }
.tabs button {
  flex: 1; height: 40px; border: 0; border-radius: 9px; background: transparent;
  font-weight: 600; color: var(--muted);
}
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14); }

.btn {
  height: 44px; padding: 0 16px; border-radius: 12px; border: 0;
  background: var(--btn); color: var(--btn-ink); font-weight: 600;
}
.btn.alt { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn[disabled] { opacity: 0.5; cursor: default; }
.newbtn { width: 100%; margin-bottom: 14px; }

.recipe { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
.rhead {
  display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent;
  text-align: left; padding: 12px 14px; min-height: 64px;
}

.ing { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 10px 6px 14px; }

.iq { color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { font-size: 13px; color: var(--accent); font-weight: 600; padding: 0 4px; white-space: nowrap; }
.mini {
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
  padding: 9px 14px; font-size: 14px; font-weight: 600; color: var(--accent); white-space: nowrap;
}
.ractions { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 14px; border-top: 1px solid var(--line); }
.ractions .btn:first-child { flex: 1 1 100%; }
.ractions .btn.alt { flex: 1; }

.editor {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px;
}
.editor label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.editor input[type="date"] {
  -webkit-appearance: none; appearance: none;
  display: block; width: 200px; max-width: 100%; min-width: 0; height: 50px;
  background: var(--bg); color: var(--ink); text-align: left; line-height: 1.2;
}
.editor input[type="date"]::-webkit-date-and-time-value { text-align: left; min-height: 1.2em; }
.editor input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.6; }
.editor input, .editor textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px;
  padding: 12px 14px; font-size: 16px; font-family: var(--font-body);
}
.editor { position: relative; }
.editor textarea { min-height: 120px; resize: none; overflow: hidden; line-height: 1.5; display: block; }
html { overflow-x: hidden; overscroll-behavior-x: none; }
body { overflow-x: hidden; }
html, body, * { touch-action: manipulation; }
.cropframe { touch-action: none; }
/* Quick repeated taps must never zoom, select text or shift the page */
html { overscroll-behavior: none; overflow-anchor: none; -webkit-text-size-adjust: 100%; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overflow-anchor: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
input, select, textarea, .form input[type="text"], .form select, .arow select, .row select, .editor input, .editor textarea { font-size: 16px !important; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.err { font-size: 14px; color: var(--ink); background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; margin: 0; }
.editor .acts { display: flex; gap: 8px; }
.editor .acts .btn { flex: 1; }

.dot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--cc, var(--done)); margin-right: 8px; }
.section h2 .lbl { display: flex; align-items: center; }
.chip .dot { width: 8px; height: 8px; margin-right: 7px; }
.ing .dot { margin-right: 0; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px 3px 8px;
  background: color-mix(in srgb, var(--cc, var(--done)) 18%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--cc, var(--done)) 40%, var(--surface));
}
.pill .dot { margin: 0; width: 8px; height: 8px; }
.rtitle .prow { display: block; margin-top: 6px; }
.rtitle .pill { font-size: 12px; font-weight: 600; color: var(--ink); margin: 0 6px 4px 0; }
.wrapchips { flex-wrap: wrap; overflow: visible; }

.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; padding-bottom: 2px; }
.filters::-webkit-scrollbar { display: none; }
.fchip {
  flex: none; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 10px 14px; font-size: 14px; font-weight: 500;
}
.fchip .dot { margin: 0; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fchip.edit { color: var(--accent); border-style: dashed; background: transparent; font-weight: 600; }
.linkbtn { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 10px 2px; }

.panel .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.panel .ptitle { font-family: var(--font-display); font-size: 22px; margin: 0; }
.crow {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 12px;
}
.nm1 { display: flex; align-items: center; gap: 4px; min-width: 0; }
.nm1 strong { flex: 1; min-width: 0; font-weight: 600; }
.nm1 input {
  flex: 1; min-width: 0; height: 44px; border: 1px solid var(--line); background: var(--bg);
  border-radius: 10px; padding: 0 12px; font-size: 16px;
}
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw {
  width: 32px; height: 32px; border-radius: 50%; padding: 0; background: var(--cc);
  border: 2px solid transparent; box-shadow: inset 0 0 0 2px var(--surface);
}
.sw[aria-pressed="true"] { border-color: var(--ink); }
.crow .btn { align-self: flex-start; height: 38px; }

.addarea { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tabbar { display: flex; gap: 6px; }
.tabbar button {
  flex: 1; height: 48px; border: 0; border-radius: 12px; background: transparent; color: var(--muted);
  font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.tabbar button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
.tabbar svg { width: 20px; height: 20px; flex: none; }
.rnav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.rnav strong { flex: 1; text-align: center; font-family: var(--font-display); font-size: 20px; }
.rnav .btn { width: 44px; padding: 0; flex: none; }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.rcard h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.rbig { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
.rsmall { font-size: 14px; color: var(--muted); margin-top: 4px; }
.sbar { margin-bottom: 10px; }
.sbar:last-child { margin-bottom: 0; }
.sbar .l { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 4px; }
.sbar .l span:first-child { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.sbar .l span:last-child { flex: none; color: var(--muted); }
.sbar .t { height: 10px; border-radius: 6px; background: var(--bg); overflow: hidden; }

.trend { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
.trend button { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; color: var(--muted); font-size: 11px; }
.trend button i { display: block; width: 100%; max-width: 38px; border-radius: 6px 6px 2px 2px; background: var(--line); min-height: 3px; }
.trend button[aria-pressed="true"] i { background: var(--accent); }
.trend button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
.rrow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 0; border-top: 1px solid var(--line); }
.rrow:first-of-type { border-top: 0; }
.rrow .m { flex: 1; min-width: 0; }
.rrow .m strong { display: block; overflow-wrap: anywhere; }
.rrow .m span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.rrow .a { flex: none; font-weight: 700; }
.shopchips { display: flex; flex-wrap: wrap; gap: 8px; }
.cookctl { display: flex; gap: 10px; }
.cookctl .btn { flex: 1; height: 56px; font-size: 17px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar-h) + 12px); z-index: 6;
  display: flex; align-items: center; gap: 12px; max-width: calc(100% - 32px);
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
  padding: 6px 6px 6px 16px; font-size: 14px; box-shadow: 0 6px 20px rgba(58, 42, 29, 0.22);

.toast button { border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 10px 12px; }
.chead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.chead strong { display: block; font-family: var(--font-display); font-size: 20px; overflow-wrap: anywhere; }
.cstep { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.cprog { display: flex; gap: 4px; margin-bottom: 20px; }

.ctext { font-size: 26px; line-height: 1.35; font-weight: 500; margin: 0 0 22px; overflow-wrap: anywhere; text-wrap: pretty; }
.ctools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.prow2 { display: flex; gap: 8px; }
.prow2 .btn { flex: 1; }
.sfield { display: flex; flex-direction: column; gap: 6px; }
.sfield label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.sfield input {
  width: 100%; height: 48px; padding: 0 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); font-size: 16px;
}
.sugg { min-height: 44px; align-items: center; }
.sugg .sh { margin: 0; white-space: nowrap; }

.altbtn { display: inline-block; min-height: 30px; margin: 4px 6px 0 0; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--accent); font-size: 13px; font-weight: 600; }

.arow { display: flex; align-items: center; gap: 10px; min-height: 52px; border-top: 1px solid var(--line); }
.arow .dot { margin: 0; }
.arow select {
  flex: none; width: 150px; height: 42px; padding: 0 8px; border-radius: 10px;

<script>
(function () {
  var KEY = "aisle-v1";
  var CATS = [
    ["produce", "Produce"], ["bakery", "Bread & bakery"], ["dairy", "Dairy & eggs"],
    ["meat", "Meat & fish"], ["cooked", "Cooked food"], ["pantry", "Pantry"], ["sauces", "Sauces & spices"], ["frozen", "Frozen"],
    ["drinks", "Drinks"], ["household", "Household"], ["other", "Other"]
  ];
  var BASE_CATS = CATS.slice();
  var BASE_LABEL = {};
  BASE_CATS.forEach(function (c) { BASE_LABEL[c[0]] = c[1]; });
  var CAT_LABEL = {};
  /* your own aisles sit before "Other"; CATS and CAT_LABEL always hold the full set */
  function syncCats(custom) {
    var list = BASE_CATS.slice(0, -1).concat(custom.map(function (c) { return [c.id, c.name]; }), BASE_CATS.slice(-1));

  syncCats([]);

  var GUESS = [

    ["cooked", ["cooked", "precooked", "pre-cooked", "rotisserie", "ready meal", "ready-made", "readymade", "ready to eat", "prepared", "deli\\b", "lasagna", "lasagne", "empanada", "croquette", "paella", "sushi", "quiche", "takeaway", "roast chicken"]],
    ["household", ["toilet", "paper", "towel", "soap", "detergent", "dish", "sponge", "bin", "trash", "shampoo", "toothpaste", "laundry", "cleaner", "foil", "bag", "batter", "bulb", "tissue", "napkin"]],
    ["drinks", ["water", "juice", "soda", "cola", "beer", "wine", "sparkling", "drink", "lemonade"]],
    ["sauces", ["sauce", "ketchup", "mayo", "mustard", "vinegar", "soy", "salsa", "pesto", "dressing", "spice", "seasoning", "salt\\b", "black pepper", "white pepper", "paprika", "cumin", "cinnamon", "oregano", "thyme", "rosemary", "curry", "chili", "chilli", "turmeric", "nutmeg", "bay leaf", "bay leaves", "cayenne", "sriracha", "tabasco", "tahini", "miso", "harissa"]],
    ["bakery", ["bread", "baguette", "bun", "roll", "croissant", "tortilla", "bagel", "cake", "toast"]],
    ["dairy", ["milk", "egg", "cheese", "butter", "yogurt", "yoghurt", "cream", "kefir", "mozzarella", "parmesan"]],
    ["meat", ["chicken", "beef", "pork", "ham", "bacon", "sausage", "fish", "salmon", "tuna", "shrimp", "steak", "turkey", "mince", "lamb"]],
    ["produce", ["apple", "banana", "tomato", "onion", "garlic", "lettuce", "spinach", "carrot", "potato", "lemon", "lime", "avocado", "pepper", "cucumber", "orange", "fruit", "veg", "salad", "mushroom", "berr", "grape", "broccoli", "basil", "parsley", "ginger", "zucchini", "courgette", "pear", "melon"]],
    ["pantry", ["pasta", "rice", "flour", "sugar", "oil", "coffee", "tea", "cereal", "oat", "bean", "lentil", "chickpea", "honey", "jam", "nut", "chocolate", "snack", "biscuit", "cracker", "can", "stock", "noodle"]]
  ].map(function (g) {
    return [g[0], g[1].map(function (k) { return new RegExp("\\b" + k.replace(/ /g, "\\s")); })];
  });

  var DEFAULTS = [
    ["Milk", "dairy"], ["Eggs", "dairy"], ["Bread", "bakery"], ["Bananas", "produce"],
    ["Coffee", "pantry"], ["Tomatoes", "produce"], ["Butter", "dairy"], ["Onions", "produce"],
    ["Pasta", "pantry"], ["Rice", "pantry"], ["Yogurt", "dairy"], ["Olive oil", "pantry"],
    ["Chicken", "meat"], ["Apples", "produce"], ["Toilet paper", "household"],
    ["Salt", "sauces"], ["Soy sauce", "sauces"]
  ];

  var CURRENCIES = ["EUR", "USD", "GBP", "CHF", "SEK", "NOK", "DKK", "PLN", "CZK", "MXN", "CAD", "AUD", "JPY"];
  var COLORS = ["red", "orange", "amber", "lime", "green", "teal", "blue", "indigo", "purple", "pink", "gray"];
  var DEF_AISLE = { produce: "green", bakery: "amber", dairy: "blue", meat: "red", cooked: "pink", pantry: "orange", sauces: "lime", frozen: "teal", drinks: "indigo", household: "purple", other: "gray" };
  function defRcats() {
    return [
      { id: "veg", name: "Vegetarian", color: "green" },
      { id: "meat", name: "Meat", color: "red" },
      { id: "fish", name: "Fish", color: "blue" },
      { id: "soup", name: "Soups", color: "amber" },
      { id: "pasta", name: "Pasta", color: "orange" },
      { id: "dessert", name: "Desserts", color: "pink" }
    ];
  }

  var state = null;
  var ref = null, dirty = false, writing = false, timer = null, autoCat = true;
  var rform = null, rmonth = null;
  var tab = "list", editing = null, open = {}, confirmDel = null;
  var sugEdit = false, lastToggle = 0;
  var settings = null, rfilter = "all", confirmCat = null, moveMode = false, delMode = false;
  var cooking = null, cookIdx = 0, showIngs = false, wakeOn = false, wake = null;
  var undoTimer = null, undoSnap = null;
  var assetsApi = null, downloadsApi = null;
  var extraLinks = null, syncPanel = null;
  function noop() {}
  /* ---- Standalone storage: photos live in IndexedDB on this phone ---- */
  var urlMap = {};
  var idb = null;
  function openIdb() {
    return new Promise(function (res) {
      try {
        var rq = indexedDB.open("aisle-photos", 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore("img"); };
        rq.onsuccess = function () { idb = rq.result; res(); };
        rq.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }
  function loadImages() {
    return openIdb().then(function () {
      if (!idb) return;
      return new Promise(function (res) {
        try {
          var tx = idb.transaction("img", "readonly");
          var st = tx.objectStore("img");
          var cur = st.openCursor();
          cur.onsuccess = function () {
            var c = cur.result;
            if (c) { urlMap[c.key] = URL.createObjectURL(c.value); c.continue(); } else res();
          };
          cur.onerror = function () { res(); };
        } catch (e) { res(); }
      });
    });
  }
  function hex32() {
    var a = new Uint8Array(16);
    crypto.getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
  }
  function localAssets() {
    if (!idb) return null;
    return {
      upload: function (blob) {
        return new Promise(function (res, rej) {
          var id = hex32();
          try {
            var tx = idb.transaction("img", "readwrite");
            tx.objectStore("img").put(blob, id);
            tx.oncomplete = function () { urlMap[id] = URL.createObjectURL(blob); res({ id: id }); };
            tx.onerror = function () { rej({ code: "quota_or_state" }); };
            tx.onabort = function () { rej({ code: "quota_or_state" }); };
          } catch (e) { rej({ code: "upstream_error" }); }
        });
      },
      delete: function (id) {
        return new Promise(function (res) {
          try {
            var tx = idb.transaction("img", "readwrite");
            tx.objectStore("img").delete(id);
            tx.oncomplete = function () {
              if (urlMap[id]) { URL.revokeObjectURL(urlMap[id]); delete urlMap[id]; }
              res({ deleted: true });
            };
            tx.onerror = function () { res({ deleted: false }); };
          } catch (e) { res({ deleted: false }); }
        });
      }
    };
  }

  function imgSrc(id) { return urlMap[id] || ""; }
  function dropAsset(id) { if (id && assetsApi) assetsApi.delete(id).catch(noop); }
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var im = new Image();
      im.onload = function () {
        var s = Math.min(1, 1200 / Math.max(im.naturalWidth, im.naturalHeight));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(im.naturalWidth * s));
        c.height = Math.max(1, Math.round(im.naturalHeight * s));
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        c.toBlob(function (b) {
          URL.revokeObjectURL(url);
          if (b) resolve(b); else reject(new Error("encode"));
        }, "image/jpeg", 0.82);
      };
      im.onerror = function () { URL.revokeObjectURL(url); reject(new Error("decode")); };
      im.src = url;
    });
  }

  function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36); }
  function $(id) { return document.getElementById(id); }

  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (k === "class") el.className = v;
        else if (k === "cc") el.style.setProperty("--cc", "var(--c-" + v + ")");
        else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v);
      });
    }
    function add(c) {
      if (c == null) return;
      if (Array.isArray(c)) { c.forEach(add); return; }
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    for (var i = 2; i < arguments.length; i++) add(arguments[i]);
    return el;
  }

  function exampleRecipe() {
    return {
      id: uid(), name: "Tomato pasta", rc: "veg", rcs: ["veg"], ex: true,
      steps: [
        "Boil salted water and cook the pasta until just tender.",
        "Fry the garlic in olive oil, add the chopped tomatoes and simmer for 10 minutes.",
        "Toss the drained pasta in the sauce.",
        "Serve with grated parmesan."
      ],
      ings: [
        { name: "Pasta", qty: 1, cat: "pantry" },
        { name: "Tomatoes", qty: 4, cat: "produce" },
        { name: "Garlic", qty: 2, cat: "produce" },
        { name: "Olive oil", qty: 1, cat: "pantry" },
        { name: "Parmesan", qty: 1, cat: "dairy" }
      ]
    };
  }

  function seed() {
    syncCats([]);
    return {
      updatedAt: 0,
      known: [],
      hidden: [],
      names: {},
      custom: [],
      receipts: [],
      shops: [],
      currency: "EUR",
      colors: JSON.parse(JSON.stringify(DEF_AISLE)),
      rcats: defRcats(),
      recipes: [exampleRecipe()],
      items: [
        { id: uid(), name: "Milk", qty: 2, cat: "dairy", done: false, ex: true },
        { id: uid(), name: "Eggs", qty: 1, cat: "dairy", done: false, ex: true },
        { id: uid(), name: "Tomatoes", qty: 4, cat: "produce", done: false, ex: true },
        { id: uid(), name: "Bread", qty: 1, cat: "bakery", done: false, ex: true },
        { id: uid(), name: "Coffee", qty: 1, cat: "pantry", done: true, ex: true }
      ]
    };
  }

  function normalize(d) {
    var items = Array.isArray(d && d.items) ? d.items : [];
    var known = Array.isArray(d && d.known) ? d.known : [];
    var colors = {}, names = {};
    var custom = (Array.isArray(d && d.custom) ? d.custom : []).filter(function (c) { return c && c.id && c.name && !BASE_LABEL[c.id]; }).slice(0, 30).map(function (c) {
      return { id: String(c.id), name: String(c.name).slice(0, 30), color: COLORS.indexOf(c.color) !== -1 ? c.color : "blue" };
    });
    syncCats(custom);
    var receipts = (Array.isArray(d && d.receipts) ? d.receipts : []).filter(function (r) {
      return r && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && isFinite(+r.amount) && +r.amount > 0 && String(r.shop || "").trim();
    }).slice(0, 5000).map(function (r) {
      var o = { id: r.id ? String(r.id) : uid(), date: r.date, shop: String(r.shop).trim().slice(0, 40), amount: Math.round(+r.amount * 100) / 100 };
      if (r.note && String(r.note).trim()) o.note = String(r.note).trim().slice(0, 80);
      return o;
    });
    var shops = [];
    (Array.isArray(d && d.shops) ? d.shops : []).concat(receipts.map(function (r) { return r.shop; })).forEach(function (n) {
      n = String(n).trim().slice(0, 40);
      if (n && !shops.some(function (x) { return x.toLowerCase() === n.toLowerCase(); })) shops.push(n);
    });
    shops = shops.slice(0, 200);
    BASE_CATS.forEach(function (c) {
      var n = d && d.names && d.names[c[0]];
      if (typeof n === "string" && n.trim()) names[c[0]] = n.trim().slice(0, 30);
    });
    CATS.forEach(function (c) {
      var v = d && d.colors && d.colors[c[0]];
      colors[c[0]] = COLORS.indexOf(v) !== -1 ? v : (DEF_AISLE[c[0]] || (custom.filter(function (x) { return x.id === c[0]; })[0] || {}).color || "gray");
    });
    var rcats = Array.isArray(d && d.rcats)
      ? d.rcats.filter(function (c) { return c && c.id && c.name; }).map(function (c) {
          return { id: String(c.id), name: String(c.name), color: COLORS.indexOf(c.color) !== -1 ? c.color : "gray" };
        })
      : defRcats();
    var recipes = Array.isArray(d && d.recipes)
      ? d.recipes.filter(function (r) { return r && r.name; }).map(function (r) {
          var o = {
            id: r.id || uid(),
            name: String(r.name),
            rcs: (Array.isArray(r.rcs) ? r.rcs : (r.rc ? [r.rc] : [])).map(String).filter(function (id, i, a) { return a.indexOf(id) === i && rcats.some(function (c) { return c.id === id; }); }),
            steps: (Array.isArray(r.steps) ? r.steps : []).map(String).filter(Boolean),
            img: typeof r.img === "string" && /^[0-9a-f]{32}$/.test(r.img) ? r.img : "",
            ings: (Array.isArray(r.ings) ? r.ings : []).filter(function (i) { return i && i.name; }).map(function (i) {
              var oi = { name: String(i.name), qty: Math.max(1, i.qty | 0 || 1), cat: CAT_LABEL[i.cat] ? i.cat : "other" };
              var al = parseAlts(i.alts, oi.name);
              if (al.length) oi.alts = al;
              return oi;
            })
          };
          o.rc = o.rcs[0] || "";
          if (r.ex) o.ex = true;
          if (r.ex && !o.steps.length) o.steps = exampleRecipe().steps;
          return o;
        })
      : [exampleRecipe()];
    return {
      updatedAt: (d && d.updatedAt) || 0,
      recipes: recipes,
      colors: colors,
      names: names,
      custom: custom,
      receipts: receipts,
      shops: shops,
      currency: CURRENCIES.indexOf(d && d.currency) !== -1 ? d.currency : "EUR",
      rcats: rcats,
      hidden: (Array.isArray(d && d.hidden) ? d.hidden : []).map(function (x) { return String(x).toLowerCase(); }).filter(Boolean).slice(0, 500),
      items: items.filter(function (i) { return i && i.name; }).map(function (i) {
        var o = { id: i.id || uid(), name: String(i.name), qty: Math.max(1, i.qty | 0 || 1), cat: CAT_LABEL[i.cat] ? i.cat : "other", done: !!i.done };
        if (i.ex) o.ex = true;
        if (i.src) o.src = String(i.src);
        return o;
      }),
      known: known.filter(function (k) { return k && k.n; }).map(function (k) {
        var o = { n: String(k.n), c: CAT_LABEL[k.c] ? k.c : "other", k: k.k | 0 || 1 };
        if (k.t > 0) o.t = +k.t;
        return o;
      })
    };
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return normalize(JSON.parse(raw));
    } catch (e) {}
    return null;
  }
  function saveLocal() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function setSync(t) { $("sync").textContent = t; }

  function save() {
    state.updatedAt = Date.now();
    saveLocal();
    if (!ref) return;
    dirty = true;
    setSync("Saving…");
    clearTimeout(timer);
    timer = setTimeout(flush, 350);
  }

  function flush() {
    if (writing || !dirty || !ref) return;
    writing = true;
    dirty = false;
    ref.set(JSON.parse(JSON.stringify(state))).then(function () {
      writing = false;
      if (dirty) timer = setTimeout(flush, 100); else setSync("Synced");
    }, function () {
      writing = false;
      setSync("Saved on this phone");
    });
  }

  function guessCat(name) {
    var n = name.trim().toLowerCase();
    if (!n) return "other";
    for (var i = 0; i < state.known.length; i++) {
      if (state.known[i].n.toLowerCase() === n) return state.known[i].c;
    }
    for (var it = 0; it < state.items.length; it++) {
      if (state.items[it].name.toLowerCase() === n) return state.items[it].cat;
    }
    for (var rr = 0; rr < state.recipes.length; rr++) {
      var ri = state.recipes[rr].ings;
      for (var q = 0; q < ri.length; q++) if (ri[q].name.toLowerCase() === n) return ri[q].cat;
    }
    for (var d = 0; d < DEFAULTS.length; d++) {
      if (DEFAULTS[d][0].toLowerCase() === n) return DEFAULTS[d][1];
    }
    for (var g = 0; g < GUESS.length; g++) {
      var res = GUESS[g][1];
      for (var r = 0; r < res.length; r++) if (res[r].test(n)) return GUESS[g][0];
    }

  /* ---- Word scoring: ranks suggestions by match quality, how often and how recently you used a word ---- */
  var DAY = 86400000;
  function hideWord(name) {

    save();
  }
  function bump(name, cat) {
    var low = name.toLowerCase();
    state.hidden = (state.hidden || []).filter(function (x) { return x !== low; });
    var k = state.known.filter(function (x) { return x.n.toLowerCase() === low; })[0];
    if (k) { k.k += 1; k.t = Date.now(); if (cat) k.c = cat; }

      state.known.push({ n: name, c: cat || guessCat(name), k: 1, t: Date.now() });

      if (!l || state.hidden.indexOf(l) !== -1) return null;
      return map[l] || (map[l] = { n: s, c: c || null, k: 0, t: 0, l: l });
    }
    state.known.forEach(function (x) { var w = get(x.n, x.c); if (!w) return; w.n = x.n; w.c = x.c; w.k += x.k; w.t = Math.max(w.t, x.t || 0); });
    state.recipes.forEach(function (r) { r.ings.forEach(function (i) { var w = get(i.name, i.cat); if (!w) return; if (!w.c) w.c = i.cat; w.k += 1; }); });
    state.items.forEach(function (i) { var w = get(i.name, i.cat); if (!w) return; if (!w.c) w.c = i.cat; w.k += 1; });

          h("button", { class: "btn alt", type: "button", onclick: turnOff }, "Turn off"))));
    } else {
      var go = h("button", { class: "btn", type: "button", onclick: turnOn }, sync.busy ? "Signing in…" : "Turn on sync");
      if (sync.busy) go.disabled = true;
      box.appendChild(h("div", { class: "crow" },
        h("strong", null, "Connect your Firebase project"),
        h("p", { class: "hint" }, "Sync uses a free Firebase project that only you can open. Use the same details on every device."),
        syncField("API key", "apiKey", "text", "AIza..."),
        syncField("Project ID", "projectId", "text", "my-aisle-1234"),
        syncField("Email", "email", "email", "you@example.com"),
        syncField("Password", "pw", "password", ""),
        go));
    }
    if (sync.msg) box.appendChild(h("p", { class: sync.msg.ok ? "hint" : "err" }, sync.msg.t));
  };

  extraLinks = function () {
    return h("button", { class: "linkbtn", type: "button", onclick: function () { settings = "sync"; sync.msg = null; render(); } },
      sync.on ? "Cloud sync (on)" : "Cloud sync");
  };

  function wrapAssetsForSync(a) {
    if (!a) return a;
    var orig = a.delete;
    a.delete = function (id) { imgDelRemote(id); return orig(id); };
    return a;
  }
  loadImages().then(function () {
    assetsApi = wrapAssetsForSync(localAssets());
    init();
    startSync();
  });
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>

</body>
</html>
