<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aisle</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aisle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2e9d8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a paper list. Sections by supermarket aisle, a cart section at the bottom, and an add bar pinned to the bottom edge. */
:root {
  --bg: #f2e9d8;
  --surface: #fbf6ea;
  --ink: #3a2a1d;
  --muted: #7b6652;
  --line: #e1d4bc;
  --accent: #8a5424;
  --accent-ink: #fffaf0;
  --accent-soft: #f5e3a8;
  --btn: #e5b02e;
  --btn-ink: #3a2a1d;
  --done: #a39078;
  --c-red: #b5473a;
  --c-orange: #d4803a;
  --c-amber: #d9a521;
  --c-lime: #8a9a3b;
  --c-green: #5e8c4f;
  --c-teal: #4f8f8b;
  --c-blue: #5b82a8;
  --c-indigo: #7a74b0;
  --c-purple: #8e5a86;
  --c-pink: #c4687e;
  --c-gray: #8f8272;
  --bar-h: 170px;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1812;
    --surface: #2a2118;
    --ink: #f2e6d2;
    --muted: #b9a68f;
    --line: #3e3226;
    --accent: #e6b73c;
    --accent-ink: #1f1812;
    --accent-soft: #4a3a1c;
    --btn: #e5b02e;
    --btn-ink: #2a1b10;
    --done: #8a7a66;
    --c-red: #e0806f;
    --c-orange: #e8a261;
    --c-amber: #e7c25a;
    --c-lime: #b5c26a;
    --c-green: #8db97c;
    --c-teal: #7fbab5;
    --c-blue: #8fb1d4;
    --c-indigo: #a9a4d6;
    --c-purple: #c79bc0;
    --c-pink: #e39aac;
    --c-gray: #b3a692;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1812;
  --surface: #2a2118;
  --ink: #f2e6d2;
  --muted: #b9a68f;
  --line: #3e3226;
  --accent: #e6b73c;
  --accent-ink: #1f1812;
  --accent-soft: #4a3a1c;
  --btn: #e5b02e;
  --btn-ink: #2a1b10;
  --done: #8a7a66;
  --c-red: #e0806f;
  --c-orange: #e8a261;
  --c-amber: #e7c25a;
  --c-lime: #b5c26a;
  --c-green: #8db97c;
  --c-teal: #7fbab5;
  --c-blue: #8fb1d4;
  --c-indigo: #a9a4d6;
  --c-purple: #c79bc0;
  --c-pink: #e39aac;
  --c-gray: #b3a692;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: 20px calc(var(--bar-h) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 520px; margin: 0 auto; min-width: 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.02em; color: var(--accent); }
.sync { font-size: 12px; color: var(--muted); }

h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 40px;
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin: 14px 0 4px;
  text-wrap: balance;
}
.sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; font-variant-numeric: tabular-nums; }

.note {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin-bottom: 16px;
  font-size: 14px;
}
.note button {
  border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 6px 4px; white-space: nowrap;
}

.section { margin-bottom: 20px; }
.section h2 {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 0 0 6px; padding: 0 2px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.section h2 button {
  border: 0; background: transparent; color: var(--accent); font-size: 13px; font-weight: 600;
  letter-spacing: 0; text-transform: none; padding: 4px 2px;
}
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 4px; min-height: 54px; padding-right: 8px; }
.row + .row { border-top: 1px solid var(--line); }
.main {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
  border: 0; background: transparent; text-align: left; padding: 8px 4px 8px 14px; min-height: 54px;
}
.tick {
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--cc, var(--done)); display: grid; place-items: center; color: transparent;
}
.tick svg { width: 14px; height: 14px; }
.name { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.row.done .tick { background: color-mix(in srgb, var(--cc, var(--accent)) 25%, var(--surface)); border-color: var(--cc, var(--accent)); color: var(--ink); }
.row.done .name { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.qty { flex: none; display: flex; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; }
.qty button {
  width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent;
  font-size: 20px; line-height: 1; color: var(--muted);
}
.qty button:active { background: var(--accent-soft); }
.qty .n { min-width: 22px; text-align: center; font-weight: 600; }
.qtytag { flex: none; color: var(--done); font-size: 14px; font-variant-numeric: tabular-nums; padding-right: 6px; }

.empty { text-align: center; color: var(--muted); padding: 36px 16px; }
.empty strong { display: block; font-family: var(--font-display); font-size: 20px; color: var(--ink); margin-bottom: 4px; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.bar-in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
  padding: 10px 14px; font-size: 14px; white-space: nowrap;
}
.chip:active { background: var(--accent-soft); }
.form { display: flex; gap: 8px; min-width: 0; }
.form input[type="text"] {
  flex: 1; min-width: 0; height: 48px; padding: 0 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); font-size: 16px;
}
.form select {
  flex: none; width: 104px; height: 48px; padding: 0 8px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); font-size: 14px;
}
.form .add {
  flex: none; height: 48px; padding: 0 18px; border-radius: 12px; border: 0;
  background: var(--btn); color: var(--btn-ink); font-weight: 600;
}
.nm { display: flex; flex-direction: column; min-width: 0; }
.src { font-size: 12px; color: var(--muted); font-weight: 400; }

.tabs { display: flex; gap: 4px; padding: 4px; background: var(--line); border-radius: 12px; margin: 0 0 18px; }
.tabs button {
  flex: 1; height: 40px; border: 0; border-radius: 9px; background: transparent;
  font-weight: 600; color: var(--muted);
}
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14); }

.btn {
  height: 44px; padding: 0 16px; border-radius: 12px; border: 0;
  background: var(--btn); color: var(--btn-ink); font-weight: 600;
}
.btn.alt { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn[disabled] { opacity: 0.5; cursor: default; }
.newbtn { width: 100%; margin-bottom: 14px; }

.recipe { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
.rhead {
  display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent;
  text-align: left; padding: 12px 14px; min-height: 64px;
}
.rtitle { flex: 1; min-width: 0; }
.rtitle strong { display: block; font-family: var(--font-display); font-size: 18px; overflow-wrap: anywhere; }
.rtitle span { font-size: 13px; color: var(--muted); }
.chev { flex: none; width: 18px; height: 18px; color: var(--muted); }
.chev svg { width: 18px; height: 18px; display: block; }
.recipe.open .chev { transform: rotate(180deg); }
.rbody { border-top: 1px solid var(--line); }
.ing { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 10px 6px 14px; }
.ing + .ing { border-top: 1px solid var(--line); }
.iname { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.iq { color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { font-size: 13px; color: var(--accent); font-weight: 600; padding: 0 4px; white-space: nowrap; }
.mini {
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
  padding: 9px 14px; font-size: 14px; font-weight: 600; color: var(--accent); white-space: nowrap;
}
.ractions { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 14px; border-top: 1px solid var(--line); }
.ractions .btn:first-child { flex: 1 1 100%; }
.ractions .btn.alt { flex: 1; }

.editor {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px;
}
.editor label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.editor input, .editor textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px;
  padding: 12px 14px; font-size: 16px; font-family: var(--font-body);
}
.editor { position: relative; }
.editor textarea { min-height: 120px; resize: none; overflow: hidden; line-height: 1.5; display: block; }
html { overflow-x: hidden; overscroll-behavior-x: none; }
body { overflow-x: hidden; touch-action: pan-y; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.err { font-size: 14px; color: var(--ink); background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; margin: 0; }
.editor .acts { display: flex; gap: 8px; }
.editor .acts .btn { flex: 1; }

.dot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--cc, var(--done)); margin-right: 8px; }
.section h2 .lbl { display: flex; align-items: center; }
.chip .dot { width: 8px; height: 8px; margin-right: 7px; }
.ing .dot { margin-right: 0; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px 3px 8px;
  background: color-mix(in srgb, var(--cc, var(--done)) 18%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--cc, var(--done)) 40%, var(--surface));
}
.pill .dot { margin: 0; width: 8px; height: 8px; }
.rtitle .prow { display: block; margin-top: 6px; }
.rtitle .pill { font-size: 12px; font-weight: 600; color: var(--ink); }

.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; padding-bottom: 2px; }
.filters::-webkit-scrollbar { display: none; }
.fchip {
  flex: none; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 10px 14px; font-size: 14px; font-weight: 500;
}
.fchip .dot { margin: 0; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fchip.edit { color: var(--accent); border-style: dashed; background: transparent; font-weight: 600; }
.linkbtn { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 10px 2px; }

.panel .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.panel .ptitle { font-family: var(--font-display); font-size: 22px; margin: 0; }
.crow {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 12px;
}
.nm1 { display: flex; align-items: center; gap: 4px; min-width: 0; }
.nm1 strong { flex: 1; min-width: 0; font-weight: 600; }
.nm1 input {
  flex: 1; min-width: 0; height: 44px; border: 1px solid var(--line); background: var(--bg);
  border-radius: 10px; padding: 0 12px; font-size: 16px;
}
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw {
  width: 32px; height: 32px; border-radius: 50%; padding: 0; background: var(--cc);
  border: 2px solid transparent; box-shadow: inset 0 0 0 2px var(--surface);
}
.sw[aria-pressed="true"] { border-color: var(--ink); }
.crow .btn { align-self: flex-start; height: 38px; }

.addarea { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tabbar { display: flex; gap: 6px; }
.tabbar button {
  flex: 1; height: 48px; border: 0; border-radius: 12px; background: transparent; color: var(--muted);
  font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.tabbar button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
.tabbar svg { width: 20px; height: 20px; flex: none; }
.cookctl { display: flex; gap: 10px; }
.cookctl .btn { flex: 1; height: 56px; font-size: 17px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar-h) + 12px); z-index: 6;
  display: flex; align-items: center; gap: 12px; max-width: calc(100% - 32px);
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
  padding: 6px 6px 6px 16px; font-size: 14px; box-shadow: 0 6px 20px rgba(58, 42, 29, 0.22);
}
.toast button { border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 10px 12px; }
.chead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.chead strong { display: block; font-family: var(--font-display); font-size: 20px; overflow-wrap: anywhere; }
.cstep { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.cprog { display: flex; gap: 4px; margin-bottom: 20px; }
.cprog span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.cprog span.on { background: var(--btn); }
.ctext { font-size: 26px; line-height: 1.35; font-weight: 500; margin: 0 0 22px; overflow-wrap: anywhere; text-wrap: pretty; }
.ctools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.prow2 { display: flex; gap: 8px; }
.prow2 .btn { flex: 1; }
.sfield { display: flex; flex-direction: column; gap: 6px; }
.sfield label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.sfield input {
  width: 100%; height: 48px; padding: 0 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); font-size: 16px;
}
.links { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.crow .hint { margin: 0; }
.rthumb { flex: none; width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--line); display: block; }
.rhero { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: var(--line); }
.photo { display: flex; flex-direction: column; gap: 10px; }
.photo .pv { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 12px; background: var(--line); display: block; }
.photo .prow2 { display: flex; gap: 8px; }
.photo .prow2 .btn { flex: 1; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }
.topr { display: flex; align-items: center; gap: 10px; min-width: 0; }
.themebtn {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; font-size: 13px; font-weight: 600;
}
.themebtn svg { width: 16px; height: 16px; flex: none; }

@media (prefers-reduced-motion: no-preference) {
  .tick, .row .name { transition: background-color 0.15s, color 0.15s, border-color 0.15s; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <span class="brand">Aisle</span>
    <span class="topr">
      <span class="sync" id="sync" role="status"></span>
      <button type="button" class="themebtn" id="themeBtn"></button>
    </span>
  </div>
  <h1>Groceries</h1>
  <p class="sub" id="sub"></p>
  <div id="note"></div>
  <div id="list"></div>
  <div id="recipes" hidden></div>
  <div id="panel" class="panel" hidden></div>
  <div id="cook" hidden></div>
</div>

<div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button type="button" id="toastUndo">Undo</button></div>

<div class="bar" id="bar">
  <div class="bar-in" id="barIn">
    <div class="addarea" id="addArea">
    <div class="chips" id="chips"></div>
    <form class="form" id="addForm" autocomplete="off">
      <input type="text" id="itemName" placeholder="Add an item" enterkeyhint="done" autocapitalize="sentences" aria-label="Item name" maxlength="80">
      <select id="itemCat" aria-label="Aisle"></select>
      <button class="add" type="submit">Add</button>
    </form>
    </div>
    <div class="cookctl" id="cookArea" hidden></div>
    <div class="tabbar" id="tabbar" role="tablist">
      <button type="button" role="tab" id="tabList" aria-selected="true">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 5h9M7.5 10h9M7.5 15h9M3.5 5h.01M3.5 10h.01M3.5 15h.01"/></svg>
        List
      </button>
      <button type="button" role="tab" id="tabRecipes" aria-selected="false">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H16v13H5.5A1.5 1.5 0 0 0 4 17.5v-13Z"/><path d="M4 17.5A1.5 1.5 0 0 0 5.5 19H16"/></svg>
        Recipes
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  var KEY = "aisle-v1";
  var CATS = [
    ["produce", "Produce"], ["bakery", "Bread & bakery"], ["dairy", "Dairy & eggs"],
    ["meat", "Meat & fish"], ["pantry", "Pantry"], ["frozen", "Frozen"],
    ["drinks", "Drinks"], ["household", "Household"], ["other", "Other"]
  ];
  var CAT_LABEL = {};
  CATS.forEach(function (c) { CAT_LABEL[c[0]] = c[1]; });

  var GUESS = [
    ["frozen", ["frozen", "ice", "pizza", "fish finger"]],
    ["household", ["toilet", "paper", "towel", "soap", "detergent", "dish", "sponge", "bin", "trash", "shampoo", "toothpaste", "laundry", "cleaner", "foil", "bag", "batter", "bulb", "tissue", "napkin"]],
    ["drinks", ["water", "juice", "soda", "cola", "beer", "wine", "sparkling", "drink", "lemonade"]],

    dark: SVG0 + '<path d="M16.5 11.5A6.5 6.5 0 0 1 8.5 3.5a6.5 6.5 0 1 0 8 8Z"/></svg>'
  };
  var theme = "auto";
  var hostTheme = document.documentElement.getAttribute("data-theme");

  function applyTheme() {
    var root = document.documentElement;
    if (theme === "auto") {
      if (hostTheme) root.setAttribute("data-theme", hostTheme);
      else root.removeAttribute("data-theme");
    } else {
      root.setAttribute("data-theme", theme);
    }
    var b = $("themeBtn");
    b.innerHTML = THEME_ICON[theme] + "<span>" + THEME_LABEL[theme] + "</span>";
    b.setAttribute("aria-label", "Theme: " + THEME_LABEL[theme] + ". Tap to change.");
  }

  function initTheme() {
    try {
      var t = localStorage.getItem("aisle-theme");
      if (THEMES.indexOf(t) !== -1) theme = t;
    } catch (e) {}
    applyTheme();
    $("themeBtn").addEventListener("click", function () {
      theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
      try { localStorage.setItem("aisle-theme", theme); } catch (e) {}
      applyTheme();
    });
  }

  function init() {
    initTheme();
    var sel = $("itemCat");
    CATS.forEach(function (c) { sel.appendChild(h("option", { value: c[0] }, c[1])); });
    sel.value = "other";

    var d = new Date();
    var eyebrow = d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
    $("sync").textContent = eyebrow;

    $("itemName").addEventListener("input", function (e) {
      if (autoCat) sel.value = guessCat(e.target.value);
      renderChips();
    });
    sel.addEventListener("change", function () { autoCat = false; });
    $("addForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var input = $("itemName");
      addItem(input.value, sel.value);
      input.value = "";
      sel.value = "other";
      autoCat = true;
      input.focus();
    });

    $("tabList").addEventListener("click", function () { tab = "list"; confirmDel = null; render(); });
    $("tabRecipes").addEventListener("click", function () { tab = "recipes"; confirmDel = null; render(); });

    $("toastUndo").addEventListener("click", doUndo);

    if (window.ResizeObserver) {
      new ResizeObserver(function () {
        document.documentElement.style.setProperty("--bar-h", $("barIn").parentNode.offsetHeight + "px");
      }).observe($("barIn").parentNode);
    }

    state = loadLocal() || seed();
    render();
    connect();
  }

  function connect() {
    if (!window.claude || !window.claude.use) return;
    window.claude.use("downloads").then(function (d) { downloadsApi = d; }).catch(noop);
    window.claude.use("assets").then(function (a) {
      if (!a) return;
      assetsApi = a;
      if (editing && tab === "recipes" && !settings && !cooking) render();
    }).catch(noop);
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (id) {
        if (!id) return;
        ref = db.doc("data/users/" + id + "/list");
        var slow = setTimeout(function () { setSync("Saved on this phone"); }, 10000);
        ref.onSnapshot(function (snap) {
          if (!snap.metadata.fromCache) clearTimeout(slow);
          if (snap.metadata.hasPendingWrites || dirty || writing) return;
          if (snap.exists) {
            var d = snap.data();
            if ((d.updatedAt || 0) !== state.updatedAt) {
              state = normalize(d);
              saveLocal();
              if (!editing && !settings && !cooking) render();
            }
            if (!snap.metadata.fromCache) setSync("Synced");
          } else if (!snap.metadata.fromCache) {
            save();
          }
        }, function () { ref = null; setSync("Saved on this phone"); });
      });
    }).catch(function () { ref = null; });
  }

  /* ---- Cloud sync through the user's own Firebase project (standalone only) ---- */
  var SKEY = "aisle-sync-v1";
  var SIMG = "aisle-sync-imgs-v1";
  var sync = { cfg: null, on: false, msg: null, busy: false, choice: null, last: 0, idToken: "", exp: 0, timer: null, pulling: false,
               draft: { apiKey: "", projectId: "", email: "", pw: "" } };
  var syncedImgs = {};
  try { var rawCfg = localStorage.getItem(SKEY); if (rawCfg) sync.cfg = JSON.parse(rawCfg); } catch (e) {}
  try { var rawImgs = localStorage.getItem(SIMG); if (rawImgs) syncedImgs = JSON.parse(rawImgs) || {}; } catch (e) {}
  if (sync.cfg) { sync.draft.apiKey = sync.cfg.apiKey || ""; sync.draft.projectId = sync.cfg.projectId || ""; sync.draft.email = sync.cfg.email || ""; }

  function cfgSave() { try { localStorage.setItem(SKEY, JSON.stringify(sync.cfg)); } catch (e) {} }
  function imgsSave() { try { localStorage.setItem(SIMG, JSON.stringify(syncedImgs)); } catch (e) {} }
  function base() {
    var c = sync.cfg || {};
    return {
      id: c.idBase || "https://identitytoolkit.googleapis.com",
      tok: c.tokBase || "https://securetoken.googleapis.com",
      fs: c.fsBase || "https://firestore.googleapis.com"
    };
  }

  function syncErr(msg, code) { var e = new Error(msg); e.syncCode = code || "error"; return e; }

  function authMessage(code) {
    var m = String(code || "");
    if (/INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_LOGIN_CREDENTIALS|INVALID_EMAIL/.test(m)) return "Wrong email or password.";
    if (/OPERATION_NOT_ALLOWED|PASSWORD_LOGIN_DISABLED/.test(m)) return "Email and password sign-in is switched off in your Firebase project.";
    if (/USER_DISABLED/.test(m)) return "That account has been disabled in Firebase.";
    if (/TOO_MANY_ATTEMPTS/.test(m)) return "Too many attempts. Wait a few minutes and try again.";
    if (/API key not valid|API_KEY_INVALID|INVALID_API_KEY/i.test(m)) return "That API key isn't valid. Copy it again from Firebase.";
    return "Couldn't sign in. Check your details and try again.";
  }

  function postJson(url, body) {
    return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, json: j }; });
    });
  }

  function signIn(email, pw) {
    var c = sync.cfg;
    return postJson(base().id + "/v1/accounts:signInWithPassword?key=" + encodeURIComponent(c.apiKey), { email: email, password: pw, returnSecureToken: true }).then(function (r) {
      if (!r.ok) {
        var m = r.json && r.json.error && (r.json.error.message || "");
        throw syncErr(authMessage(m), "auth");
      }
      sync.idToken = r.json.idToken;
      sync.exp = Date.now() + (parseInt(r.json.expiresIn, 10) || 3600) * 1000;
      c.refreshToken = r.json.refreshToken;
      c.uid = r.json.localId;
      c.email = r.json.email || email;
      cfgSave();
    }, function (e) {
      if (e && e.syncCode) throw e;
      throw syncErr("Couldn't reach Firebase. Check your connection.", "net");
    });
  }

  function refreshToken() {
    var c = sync.cfg;
    if (!c || !c.refreshToken) return Promise.reject(syncErr("Sign in again.", "auth"));
    return fetch(base().tok + "/v1/token?key=" + encodeURIComponent(c.apiKey), {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(c.refreshToken)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw syncErr("Sign in again.", "auth");
        sync.idToken = j.id_token;
        sync.exp = Date.now() + (parseInt(j.expires_in, 10) || 3600) * 1000;
        if (j.refresh_token) { c.refreshToken = j.refresh_token; cfgSave(); }
      });
    }, function (e) {
      if (e && e.syncCode) throw e;
      throw syncErr("Offline", "net");
    });
  }

  function getToken() {
    if (sync.idToken && Date.now() < sync.exp - 60000) return Promise.resolve(sync.idToken);
    return refreshToken().then(function () { return sync.idToken; });
  }

  function docUrl(path) {
    var c = sync.cfg;
    return base().fs + "/v1/projects/" + encodeURIComponent(c.projectId) + "/databases/(default)/documents/users/" + encodeURIComponent(c.uid) + "/" + path;
  }

  function api(method, path, body, retried) {
    return getToken().then(function (t) {
      return fetch(docUrl(path), {
        method: method,
        headers: { "Authorization": "Bearer " + t, "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined
      });
    }, function (e) { throw e; }).then(function (r) {
      if (r.status === 401 && !retried) { sync.exp = 0; return api(method, path, body, true); }
      return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, json: j }; });
    }, function (e) {
      if (e && e.syncCode) throw e;
      throw syncErr("Offline", "net");
    });
  }

  function failFrom(r) {
    if (r.status === 403) return syncErr("Firestore refused access. Check that the security rules from the setup steps are published.", "rules");
    if (r.status === 401) return syncErr("Sign in again.", "auth");
    if (r.status === 404 && r.json && r.json.error && /database/i.test(r.json.error.message || "")) return syncErr("Create the Firestore database in your Firebase project first.", "rules");
    return syncErr("Sync failed (" + r.status + ").", "error");
  }

  function remoteGet() {
    return api("GET", "state/main").then(function (r) {
      if (r.status === 404) return null;
      if (r.status !== 200) throw failFrom(r);
      var f = r.json.fields || {};
      return { json: f.json && f.json.stringValue, updatedAt: Number(f.updatedAt && f.updatedAt.integerValue) || 0 };
    });
  }

  function remotePut(data) {
    return api("PATCH", "state/main?updateMask.fieldPaths=json&updateMask.fieldPaths=updatedAt", {
      fields: { json: { stringValue: JSON.stringify(data) }, updatedAt: { integerValue: String(data.updatedAt || 0) } }
    }).then(function (r) { if (r.status !== 200) throw failFrom(r); });
  }

  /* photos: re-encoded small enough for one Firestore field */
  function syncImgData(id) {
    return new Promise(function (resolve) {
      var im = new Image();
      im.onload = function () {
        function enc(maxSide, q) {
          var s = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
          var c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(im.naturalWidth * s));
          c.height = Math.max(1, Math.round(im.naturalHeight * s));
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
          return c.toDataURL("image/jpeg", q);
        }
        try {
          var u = enc(1000, 0.8);
          if (u.length > 900000) u = enc(700, 0.7);
          resolve(u.length > 950000 ? "" : u);
        } catch (e) { resolve(""); }
      };
      im.onerror = function () { resolve(""); };
      im.src = imgSrc(id);
    });
  }

  function imgPut(id) {
    return syncImgData(id).then(function (u) {
      if (!u) return;
      return api("PATCH", "images/" + encodeURIComponent(id) + "?updateMask.fieldPaths=data", { fields: { data: { stringValue: u } } }).then(function (r) {
        if (r.status !== 200) throw failFrom(r);
        syncedImgs[id] = 1; imgsSave();
      });
    });
  }

  function imgGet(id) {
    return api("GET", "images/" + encodeURIComponent(id)).then(function (r) {
      if (r.status === 404) return null;
      if (r.status !== 200) throw failFrom(r);
      var f = r.json.fields || {};
      return f.data && f.data.stringValue || null;
    });
  }

  function imgDelRemote(id) {
    if (!sync.on) return;
    delete syncedImgs[id]; imgsSave();
    api("DELETE", "images/" + encodeURIComponent(id)).catch(function () {});
  }

  function putLocalImage(id, blob) {
    return new Promise(function (res, rej) {
      if (!idb) { rej(new Error("no storage")); return; }
      var tx = idb.transaction("img", "readwrite");
      tx.objectStore("img").put(blob, id);
      tx.oncomplete = function () { urlMap[id] = URL.createObjectURL(blob); res(); };
      tx.onerror = function () { rej(new Error("store")); };
      tx.onabort = function () { rej(new Error("store")); };
    });
  }

  function pushImages(data) {
    var ids = (data.recipes || []).map(function (r) { return r.img; }).filter(function (id) { return id && !syncedImgs[id] && urlMap[id]; });
    return ids.reduce(function (p, id) { return p.then(function () { return imgPut(id); }); }, Promise.resolve());
  }

  function syncPush(data) {
    return pushImages(data).then(function () { return remotePut(data); }).then(function () { sync.last = Date.now(); });
  }

  function applyRemote(remote) {
    var d;
    try { d = JSON.parse(remote.json); } catch (e) { return Promise.reject(syncErr("The cloud copy is unreadable.", "error")); }
    var incoming = normalize(d);
    incoming.updatedAt = remote.updatedAt || incoming.updatedAt;
    var need = incoming.recipes.filter(function (r) { return r.img && !urlMap[r.img]; });
    return need.reduce(function (p, r) {
      return p.then(function () {
        return imgGet(r.img).then(function (u) {
          if (!u || u.indexOf("data:image/") !== 0) { r.img = ""; return; }
          return putLocalImage(r.img, dataUrlToBlob(u)).then(function () { syncedImgs[r.img] = 1; });
        });
      });
    }, Promise.resolve()).then(function () {
      imgsSave();
      incoming.recipes.forEach(function (r) { if (r.img) syncedImgs[r.img] = 1; });
      state = incoming;
      saveLocal();
      sync.last = Date.now();
      if (!editing && !settings && !cooking) render();
    });
  }

  function pull() {
    if (!sync.on || sync.pulling || dirty || writing) return Promise.resolve();
    sync.pulling = true;
    return remoteGet().then(function (remote) {
      if (!remote) return state.updatedAt > 0 ? syncPush(JSON.parse(JSON.stringify(state))) : null;
      if (remote.updatedAt > state.updatedAt) return applyRemote(remote);
      if (remote.updatedAt < state.updatedAt) return syncPush(JSON.parse(JSON.stringify(state)));
    }).then(function () {
      sync.pulling = false;
      sync.last = Date.now();
      setSync("Synced");
    }, function (e) {
      sync.pulling = false;
      if (e && e.syncCode === "net") setSync("Offline, will sync later");
      else if (e && e.syncCode === "auth") { setSync("Sign in again"); sync.on = false; stopSync(); sync.msg = { ok: false, t: "You've been signed out. Sign in again to keep syncing." }; }
      else setSync("Sync problem");
      if (e && e.syncCode !== "net") sync.msg = { ok: false, t: e.message };
    });
  }

  var fakeRef = { set: function (data) { return syncPush(data); } };

  function startSync() {
    if (!sync.cfg || !sync.cfg.enabled || !sync.cfg.joined) return;
    sync.on = true;
    ref = fakeRef;
    clearInterval(sync.timer);
    sync.timer = setInterval(function () { if (document.visibilityState !== "hidden") pull(); }, sync.cfg.poll || 15000);
    pull();
  }

  function stopSync() {
    sync.on = false;
    ref = null;
    clearInterval(sync.timer);
  }

  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") pull(); });
  window.addEventListener("online", function () { pull(); });

  function hasRealData() { return state.updatedAt > 0; }

  function finishJoin() {
    sync.cfg.joined = true; sync.cfg.enabled = true; cfgSave();
    sync.choice = null;
    sync.draft.pw = "";
    sync.msg = { ok: true, t: "Sync is on." };
    startSync();
  }

  function joinAccount() {
    return remoteGet().then(function (remote) {
      if (!remote) {
        if (!hasRealData()) state.updatedAt = Date.now();
        return syncPush(JSON.parse(JSON.stringify(state))).then(finishJoin);
      }
      if (!hasRealData()) return applyRemote(remote).then(finishJoin);
      sync.choice = remote;
    });
  }

  function turnOn() {
    var d = sync.draft;
    var apiKey = d.apiKey.trim(), projectId = d.projectId.trim(), email = d.email.trim();
    if (!apiKey || !projectId || !email || !d.pw) { sync.msg = { ok: false, t: "Fill in all four boxes." }; render(); return; }
    var prev = sync.cfg || {};
    sync.cfg = { apiKey: apiKey, projectId: projectId, email: email, idBase: prev.idBase, tokBase: prev.tokBase, fsBase: prev.fsBase, poll: prev.poll };
    sync.busy = true; sync.msg = null; render();
    signIn(email, d.pw).then(joinAccount).then(function () {
      sync.busy = false; render();
    }, function (e) {
      sync.busy = false;
      sync.msg = { ok: false, t: (e && e.message) || "Something went wrong." };
      render();
    });
  }

  function turnOff() {
    stopSync();
    if (sync.cfg) { sync.cfg.enabled = false; sync.cfg.joined = false; sync.cfg.refreshToken = ""; cfgSave(); }
    sync.idToken = ""; sync.choice = null;
    sync.msg = { ok: true, t: "Sync is off. Your data stays on this device." };
    setSync("Saved on this phone");
    render();
  }

  function fmtTime(t) {
    try { return new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; }
  }

  function syncField(label, key, type, ph) {
    var id = "sync_" + key;
    var inp = h("input", { type: type, id: id, placeholder: ph || "", autocomplete: key === "pw" ? "current-password" : "off", autocapitalize: "none", autocorrect: "off", spellcheck: "false" });
    inp.value = sync.draft[key] || "";
    inp.addEventListener("input", function () { sync.draft[key] = inp.value; });
    return h("div", { class: "sfield" }, h("label", { for: id }, label), inp);
  }

  syncPanel = function (box) {
    if (sync.choice) {
      box.appendChild(h("div", { class: "crow" },
        h("strong", null, "This account already has a list"),
        h("p", { class: "hint" }, "Choose which copy to keep. The other one is replaced."),
        h("button", { class: "btn", type: "button", onclick: function () {
          var remote = sync.choice; sync.busy = true; render();
          applyRemote(remote).then(finishJoin).then(function () { sync.busy = false; render(); }, function (e) { sync.busy = false; sync.msg = { ok: false, t: (e && e.message) || "Couldn't load the cloud copy." }; render(); });
        } }, "Use the cloud copy"),
        h("button", { class: "btn alt", type: "button", onclick: function () {
          sync.busy = true; render();
          state.updatedAt = Date.now(); saveLocal();
          syncPush(JSON.parse(JSON.stringify(state))).then(finishJoin).then(function () { sync.busy = false; render(); }, function (e) { sync.busy = false; sync.msg = { ok: false, t: (e && e.message) || "Couldn't upload." }; render(); });
        } }, "Use this device's copy")));
    } else if (sync.on) {
      box.appendChild(h("div", { class: "crow" },
        h("strong", null, "Sync is on"),
        h("p", { class: "hint" }, "Signed in as " + (sync.cfg.email || "your account") + (sync.last ? ". Last synced at " + fmtTime(sync.last) + "." : ".")),
        h("div", { class: "prow2" },
          h("button", { class: "btn", type: "button", onclick: function () { sync.msg = null; sync.busy = true; render(); pull().then(function () { sync.busy = false; if (!sync.msg) sync.msg = { ok: true, t: "Up to date." }; render(); }); } }, "Sync now"),
          h("button", { class: "btn alt", type: "button", onclick: turnOff }, "Turn off"))));
    } else {
      var go = h("button", { class: "btn", type: "button", onclick: turnOn }, sync.busy ? "Signing in…" : "Turn on sync");
      if (sync.busy) go.disabled = true;
      box.appendChild(h("div", { class: "crow" },
        h("strong", null, "Connect your Firebase project"),
        h("p", { class: "hint" }, "Sync uses a free Firebase project that only you can open. Use the same details on every device."),
        syncField("API key", "apiKey", "text", "AIza..."),
        syncField("Project ID", "projectId", "text", "my-aisle-1234"),
        syncField("Email", "email", "email", "you@example.com"),
        syncField("Password", "pw", "password", ""),
        go));
    }
    if (sync.msg) box.appendChild(h("p", { class: sync.msg.ok ? "hint" : "err" }, sync.msg.t));
  };

  extraLinks = function () {
    return h("button", { class: "linkbtn", type: "button", onclick: function () { settings = "sync"; sync.msg = null; render(); } },
      sync.on ? "Cloud sync (on)" : "Cloud sync");
  };

  function wrapAssetsForSync(a) {
    if (!a) return a;
    var orig = a.delete;
    a.delete = function (id) { imgDelRemote(id); return orig(id); };
    return a;
  }
  loadImages().then(function () {
    assetsApi = wrapAssetsForSync(localAssets());
    init();
    startSync();
  });
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>

</body>
